# CI for the runnable services in this repository.
#
# The audio normaliser needs ffmpeg to run its tests, so the job installs it
# rather than skipping the tests that matter most.

name: Services

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - ".github/workflows/services.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/**"
      - ".github/workflows/services.yml"

permissions:
  contents: read

jobs:
  audio-normaliser:
    name: Audio normaliser
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/audio-normaliser

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/audio-normaliser/pyproject.toml

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the tests
        run: python -m pytest tests/ -v

      - name: Check the package builds
        run: python -m pip install --upgrade build && python -m build

      - name: Check the template is valid YAML
        run: python -c "import yaml,sys; yaml.safe_load(open('template.yaml'))"
