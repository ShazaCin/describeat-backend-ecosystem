# CI for the runnable services in this repository.
#
# The audio normaliser needs ffmpeg to run its tests, so the job installs it
# rather than skipping the tests that matter most.

name: Services

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - ".github/workflows/services.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/**"
      - ".github/workflows/services.yml"

permissions:
  contents: read

jobs:
  audio-normaliser:
    name: Audio normaliser
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/audio-normaliser

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/audio-normaliser/pyproject.toml

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the tests
        run: python -m pytest tests/ -v

      - name: Check the package builds
        run: python -m pip install --upgrade build && python -m build

      - name: Check the template parses
        # The SAM template uses CloudFormation short-form tags such as
        # !Ref and !Sub, which are not part of plain YAML. They have to be
        # registered before the document can be loaded.
        run: |
          python - <<'PY'
          import yaml

          class CfnLoader(yaml.SafeLoader):
              pass

          def multi_constructor(loader, tag_suffix, node):
              if isinstance(node, yaml.ScalarNode):
                  return loader.construct_scalar(node)
              if isinstance(node, yaml.SequenceNode):
                  return loader.construct_sequence(node)
              return loader.construct_mapping(node)

          CfnLoader.add_multi_constructor("!", multi_constructor)

          with open("template.yaml") as handle:
              document = yaml.load(handle, Loader=CfnLoader)

          assert "Resources" in document, "the template has no Resources section"
          print("template.yaml parses,", len(document["Resources"]), "resources")
          PY
