# CI for DescribeAT Backend & Ecosystem (documentation repo)
# Runs on every push and PR to main

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g markdownlint-cli2
      - run: markdownlint-cli2 "docs/**/*.md" "README.md" "CONTRIBUTING.md" "SECURITY.md" "GOVERNANCE.md" "TRADEMARK.md" "workflows/**/*.md" "data-examples/README.md" "examples/*.md"

  link-check:
    name: Link check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g markdown-link-check
      - run: |
          find . -name "*.md" -not -path "./.git/*" -not -path "./node_modules/*" | while read f; do
            markdown-link-check "$f" --quiet --alive 200 || true
          done

  json-validate:
    name: JSON validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          find . -name "*.json" -not -path "./.git/*" -not -path "./node_modules/*" | while read f; do
            echo "Validating $f"
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1
          done

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Scanning for common secret patterns..."
          # Exclude lines that are clearly documentation examples (code blocks, example commands)
          if grep -rnE "(AKIA[0-9A-Z]{16}|ghp_[a-zA-Z0-9]{36}|sk-[a-zA-Z0-9]{48}|-----BEGIN (RSA |EC )?PRIVATE KEY-----)" --include="*.md" --include="*.json" --include="*.yml" --include="*.yaml" . 2>/dev/null | grep -v ".git/" | grep -v "REDACTED" | grep -v "example"; then
            echo "⚠️  Potential secrets found!"
            exit 1
          fi
          echo "✅ No secrets found."

  svg-validate:
    name: SVG validation
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -d diagrams ]; then
            for f in diagrams/*.svg; do
              echo "Validating $f"
              head -1 "$f" | grep -q "<?xml" || head -1 "$f" | grep -q "<svg" || { echo "Invalid SVG: $f"; exit 1; }
            done
            echo "✅ All SVGs valid."
          fi