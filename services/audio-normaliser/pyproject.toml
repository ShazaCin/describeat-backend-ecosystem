[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "describeat-audio"
version = "0.1.0"
description = "Audio normalisation service for the DescribeAT backend: calibrates reference audio to fingerprint-grade format and compresses AD tracks to the minimum required size."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "DescribeAT contributors" }]
keywords = ["describeat", "audio-description", "ffmpeg", "accessibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Conversion",
]

# No runtime dependencies. The service shells out to ffmpeg/ffprobe, which are
# the same binaries used by the rest of the media toolchain.
dependencies = []

[project.optional-dependencies]
# Only needed for the S3/Lambda path. The core normaliser and CLI do not import boto3.
aws = ["boto3>=1.34"]
dev = ["pytest>=8"]

[project.scripts]
describeat-audio = "describeat_audio.cli:main"

[project.urls]
Homepage = "https://github.com/ShazaCin/describeat-backend-ecosystem"
Issues = "https://github.com/ShazaCin/describeat-backend-ecosystem/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "ffmpeg: test requires the ffmpeg and ffprobe binaries",
]
